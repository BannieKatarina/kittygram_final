server {
  listen 80;

  location /api/ {
    proxy_set_header Host $http_host;
    proxy_pass http://backend:8000/api/;
  }
  location /admin/ {
    proxy_set_header Host $http_host;
    proxy_pass http://backend:8000/admin/;
  }

  location /media/ {
    alias /media/;
    expires 1d;
    add_header Cache-Control "public, immutable";
  }

  location / {
    alias /staticfiles/;
    index index.html;
  }
}